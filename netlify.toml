[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22.13.0"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_SITE_URL = "https://brilhar-estetica-automotiva.netlify.app"

[[headers]]
  for = "/_next/static/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
